name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (fast tier)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - name: Install conda env from environment.yml
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: eaves
          cache-environment: true
          cache-environment-key: eaves-${{ hashFiles('environment.yml') }}

      # The pins equal the `test` and `mcp` extras of pyproject.toml, which `--no-deps` skips
      - name: Install the eaves package (editable, no deps), pytest and mcp
        run: |
          pip install -e . --no-deps
          pip install "pytest>=7" "mcp>=1.3"

      - name: Run pytest (fast tier)
        run: pytest -v -m "not slow"
